<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>그루트 | 창원시 전기차 충전소 추천 및 수요 분산 MVP</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --border: #e5e7eb;
      --ok-bg: #ecfdf5;
      --ok-text: #065f46;
      --warn-bg: #fffbeb;
      --warn-text: #92400e;
      --bad-bg: #fef2f2;
      --bad-text: #991b1b;
      --sim-bg: #eef2ff;
      --sim-text: #3730a3;
      --real-bg: #e0f2fe;
      --real-text: #075985;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 20px 24px;
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    header h1 { margin: 0 0 4px; font-size: 1.35rem; }
    header p { margin: 0; color: #cbd5e1; font-size: 0.88rem; }
    .team-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.82rem;
      color: #e2e8f0;
    }
    .container {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 20px;
    }
    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      margin-bottom: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      margin-top: 6px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .badge-sim { background: var(--sim-bg); color: var(--sim-text); }
    .badge-real { background: var(--real-bg); color: var(--real-text); }
    .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
    .badge-bad { background: var(--bad-bg); color: var(--bad-text); }
    .rec-card {
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 16px;
      background: #eff6ff;
      margin-bottom: 14px;
    }
    .alert-card {
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 16px;
      background: #fffbeb;
      margin-bottom: 14px;
    }
    .error-card {
      border: 2px solid #dc2626;
      border-radius: 12px;
      padding: 16px;
      background: #fef2f2;
      margin-bottom: 14px;
    }
    .alt-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: #f9fafb;
      margin-bottom: 10px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .metric {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .metric .k { font-size: 0.75rem; color: var(--muted); }
    .metric .v { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
    .pattern-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 8px;
    }
    .pattern-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #f8fafc;
    }
    .pattern-box.active {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
    }
    .toolbar select {
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    th { background: #f9fafb; font-weight: 600; }
    .note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>창원시 전기차 충전소 추천 및 수요 분산 MVP</h1>
        <p>대상 거점: 의창구 팔용동 · 성산구 중앙동 · 진해구 석동 | <span class="badge badge-real">실제 API 옵션</span><span class="badge badge-sim">시뮬레이션/계산 포함</span></p>
      </div>
      <div class="team-box">
        <strong>팀명: 그루트</strong> | 팀장: 임승현 | 팀원: 이정후, 이찬준, 이은규, 동화준 (총 5명)
      </div>
    </div>
  </header>

  <div class="container">
    <div>
      <section class="panel">
        <h2>1. 사용자 및 충전 조건 입력</h2>

        <div class="field">
          <label for="region">현재 위치 / 이용 거점</label>
          <select id="region">
            <option value="팔용동">의창구 팔용동</option>
            <option value="중앙동">성산구 중앙동</option>
            <option value="석동">진해구 석동</option>
          </select>
        </div>

        <div class="field">
          <label for="destination">기존 이동 경로 / 목적지</label>
          <input id="destination" type="text" value="창원 거점 내 업무·쇼핑·식사 이동" />
        </div>

        <div class="row-2">
          <div class="field">
            <label for="currentSoc">현재 SOC (%)</label>
            <input id="currentSoc" type="number" min="0" max="100" value="30" />
          </div>
          <div class="field">
            <label for="targetSoc">목표 SOC (%)</label>
            <input id="targetSoc" type="number" min="1" max="100" value="80" />
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="batteryKwh">배터리 용량 (kWh)</label>
            <input id="batteryKwh" type="number" min="10" max="250" step="1" value="60" />
          </div>
          <div class="field">
            <label for="maxVehicleKw">차량 최대 수용 출력 (kW)</
